<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aetherium Pixel Odyssey</title>
    <style>
        :root {
            --bg-pixel: #0d0b1e;
            --panel-bg: #15122b;
            --panel-border: #3c3563;
            --gold: #fde047;
            --text-main: #f1f5f9;
            --text-dim: #94a3b8;
            --accent: #8b5cf6;
            --accent-hover: #7c3aed;
        }

        body {
            font-family: 'Courier New', Courier, monospace; /* Retro pixel feel */
            background-color: var(--bg-pixel);
            color: var(--text-main);
            margin: 0;
            padding: 15px;
            display: flex;
            height: 100vh;
            box-sizing: border-box;
            gap: 15px;
            overflow: hidden;
            user-select: none;
            image-rendering: pixelated;
        }

        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: var(--bg-pixel); }
        ::-webkit-scrollbar-thumb { background: var(--panel-border); border-radius: 0; }

        .column {
            background: var(--panel-bg);
            border: 4px solid var(--panel-border);
            border-radius: 4px;
            padding: 15px;
            overflow-y: auto;
            box-shadow: inset 0 0 10px rgba(0,0,0,0.8), 0 8px 0 rgba(0,0,0,0.5);
            display: flex;
            flex-direction: column;
        }

        #left-col { flex: 1.1; text-align: center; align-items: center; justify-content: space-between; position: relative; }
        #mid-col { flex: 1.6; }
        #right-col { flex: 1.3; }

        h1, h2, h3 { 
            color: var(--gold); 
            margin-top: 0; 
            text-transform: uppercase;
            letter-spacing: 1px;
            text-shadow: 2px 2px 0px #000;
        }

        #quanta-container {
            background: #090714;
            border: 3px solid var(--panel-border);
            padding: 12px;
            width: 100%;
            box-sizing: border-box;
        }
        #quanta-display { 
            font-size: 2.2rem; 
            font-weight: bold; 
            color: var(--gold); 
            text-shadow: 2px 2px 0px #000;
            margin: 5px 0;
        }
        #cps-display { font-size: 1rem; color: var(--text-dim); }

        /* Pixel Art Harvest Button */
        .clicker-container {
            position: relative;
            display: flex;
            justify-content: center;
            align-items: center;
            margin: 20px 0;
        }
        .pixel-harvest-btn {
            background: #4c1d95;
            border: 4px solid #c4b5fd;
            width: 180px;
            height: 180px;
            cursor: pointer;
            box-shadow: 0 8px 0 #2e1065, 0 15px 25px rgba(0,0,0,0.6);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            transition: transform 0.05s, box-shadow 0.05s;
        }
        .pixel-harvest-btn:active {
            transform: translateY(6px);
            box-shadow: 0 2px 0 #2e1065, 0 5px 10px rgba(0,0,0,0.6);
        }

        .click-float {
            position: absolute;
            color: var(--gold);
            font-size: 1.2rem;
            font-weight: bold;
            text-shadow: 2px 2px 0px #000;
            pointer-events: none;
            animation: floatUp 0.7s steps(10) forwards;
        }
        @keyframes floatUp {
            0% { opacity: 1; transform: translateY(0); }
            100% { opacity: 0; transform: translateY(-50px); }
        }

        /* Item Cards with Pixel Icon Canvas */
        .item-card {
            background: #1e1b38;
            border: 3px solid var(--panel-border);
            padding: 10px;
            margin-bottom: 8px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 4px 0 rgba(0,0,0,0.4);
        }
        .item-card:hover { border-color: var(--gold); }

        .pixel-icon {
            width: 48px;
            height: 48px;
            border: 2px solid #5b21b6;
            background: #0f0c1b;
            margin-right: 12px;
            flex-shrink: 0;
            image-rendering: pixelated;
        }

        button.action-btn {
            background: #7c3aed;
            color: #fff;
            border: 3px solid #c4b5fd;
            padding: 6px 12px;
            font-weight: bold;
            font-family: 'Courier New', Courier, monospace;
            cursor: pointer;
            box-shadow: 0 4px 0 #4c1d95;
        }
        button.action-btn:active { transform: translateY(2px); box-shadow: 0 2px 0 #4c1d95; }
        button:disabled { background: #262142 !important; border-color: #3b355e !important; color: #64748b !important; box-shadow: none !important; cursor: not-allowed; }

        .tab-bar { display: flex; gap: 4px; margin-bottom: 12px; }
        .tab-btn { 
            flex: 1; 
            padding: 8px; 
            background: #110e22; 
            color: var(--text-dim); 
            border: 3px solid var(--panel-border); 
            cursor: pointer; 
            font-family: 'Courier New', Courier, monospace;
            font-weight: bold;
            font-size: 0.8rem;
        }
        .tab-btn.active { background: var(--accent); color: #fff; border-color: #c4b5fd; }
        .tab-pane { display: none; flex: 1; overflow-y: auto; }
        .tab-pane.active { display: flex; flex-direction: column; }

        .stat-row { display: flex; justify-content: space-between; padding: 8px 0; border-bottom: 2px dashed var(--panel-border); font-size: 0.9rem; }
        .stat-label { color: var(--text-dim); }
        .stat-value { font-weight: bold; color: var(--gold); }
    </style>
</head>
<body>

    <!-- LEFT COLUMN -->
    <div class="column" id="left-col">
        <div id="quanta-container">
            <h2>Aether Core</h2>
            <div id="quanta-display">0</div>
            <div id="cps-display">CPS: 0.0</div>
        </div>
        
        <div class="clicker-container">
            <div class="pixel-harvest-btn" onclick="clickQuanta(event)">
                <canvas id="harvestCanvas" width="48" height="48" style="image-rendering: pixelated; width: 48px; height: 48px; margin-bottom: 4px;"></canvas>
                <span style="font-size: 0.75rem; font-weight: bold; color: var(--gold); text-shadow: 1px 1px 0 #000;">HARVEST</span>
            </div>
        </div>

        <div style="width: 100%;">
            <button class="action-btn" onclick="ascend()" style="background: #dc2626; border-color: #fca5a5; width: 100%; padding: 10px; box-shadow: 0 4px 0 #991b1b;">ASCEND (LEGACY)</button>
            <p style="font-size: 0.8rem; color: var(--text-dim); margin: 6px 0 0 0;">Legacy Shards: <span id="chips-display" style="color:var(--gold); font-weight:bold;">0</span> (+<span id="chips-pending">0</span>)</p>
        </div>
    </div>

    <!-- MIDDLE COLUMN -->
    <div class="column" id="mid-col">
        <div class="tab-bar">
            <button class="tab-btn active" onclick="switchTab('mid', 'buildings-pane')">Constructs (50)</button>
            <button class="tab-btn" onclick="switchTab('mid', 'minigames-pane')">Flux Core</button>
        </div>

        <div id="buildings-pane" class="tab-pane active">
            <div id="buildings-container"></div>
        </div>

        <div id="minigames-pane" class="tab-pane">
            <h3>Matrix Resonance</h3>
            <p style="color: var(--text-dim); font-size: 0.85rem;">Calibrate harmonic frequencies for temporal energy bursts.</p>
            <div style="background: #0f0c1b; border: 3px dashed var(--panel-border); padding: 15px; text-align: center; margin-top: 10px;">
                <div id="mg-status" style="font-size: 1rem; font-weight: bold; margin-bottom: 10px; color: #4ade80;">Matrix Calibrated</div>
                <button class="action-btn" id="mg-btn" onclick="triggerOverclock()">Harmonic Surge</button>
            </div>
        </div>
    </div>

    <!-- RIGHT COLUMN -->
    <div class="column" id="right-col">
        <div class="tab-bar">
            <button class="tab-btn active" onclick="switchTab('right', 'upgrades-pane')">Upgrades</button>
            <button class="tab-btn" onclick="switchTab('right', 'achievements-pane')">Milestones</button>
            <button class="tab-btn" onclick="switchTab('right', 'stats-pane')">Live Stats</button>
        </div>

        <div id="upgrades-pane" class="tab-pane active">
            <div style="margin-bottom: 8px; font-size: 0.8rem; color: var(--text-dim);">Available Technology:</div>
            <div id="upgrades-container"></div>
        </div>

        <div id="achievements-pane" class="tab-pane">
            <div id="achievements-container"></div>
        </div>

        <div id="stats-pane" class="tab-pane">
            <h3>Real-Time Analytics</h3>
            <div id="stats-container"></div>
        </div>
    </div>

    <script>
        let game = {
            quanta: 0,
            totalEarned: 0,
            totalClicks: 0,
            timePlayed: 0,
            cps: 0,
            cpc: 1,
            chips: 0,
            buildings: [],
            upgrades: [],
            achievements: []
        };

        function formatNumber(num) {
            if (num < 1000) return num.toFixed(num % 1 === 0 ? 0 : 1);
            const suffixes = ["", "k", "M", "B", "T", "Qa", "Qi", "Sx", "Sp", "Oc", "No", "Dc"];
            let i = Math.floor(Math.log10(num) / 3);
            if (i >= suffixes.length) return num.toExponential(2).replace('e+', 'E');
            let val = num / Math.pow(10, i * 3);
            return `${val.toFixed(2)} ${suffixes[i]}`;
        }

        // Procedural Pixel Art Generator for Canvas Icons
        function drawPixelSprite(canvasId, seed) {
            let canvas = document.getElementById(canvasId);
            if (!canvas) return;
            let ctx = canvas.getContext('2d');
            ctx.imageSmoothingEnabled = false;
            ctx.clearRect(0, 0, 16, 16);
            
            let colors = ['#fde047', '#38bdf8', '#fb7185', '#c084fc', '#34d399', '#f472b6'];
            let primary = colors[seed % colors.length];
            let secondary = '#1e1b38';

            for (let x = 0; x < 16; x++) {
                for (let y = 0; y < 16; y++) {
                    let hash = Math.sin(seed * 99 + x * 13 + y * 37) * 10000;
                    hash = hash - Math.floor(hash);
                    if ((x - 7.5)*(x - 7.5) + (y - 7.5)*(y - 7.5) < 36 && hash > 0.3) {
                        ctx.fillStyle = (x + y) % 2 === 0 ? primary : '#ffffff';
                        ctx.fillRect(x, y, 1, 1);
                    } else if (hash > 0.85) {
                        ctx.fillStyle = secondary;
                        ctx.fillRect(x, y, 1, 1);
                    }
                }
            }
        }

        // Draw Harvest Button Pixel Icon on startup
        window.addEventListener('load', () => {
            let harvestCanvas = document.getElementById('harvestCanvas');
            let hCtx = harvestCanvas.getContext('2d');
            hCtx.imageSmoothingEnabled = false;
            for(let x=0; x<16; x++) {
                for(let y=0; y<16; y++) {
                    hCtx.fillStyle = (x+y)%2===0 ? '#fde047' : '#ea580c';
                    hCtx.fillRect(x, y, 1, 1);
                }
            }
        });

        const buildingNames = [
            "Aether Probe", "Resonance Spindle", "Plasma Catalyst", "Void Extractor", "Singularity Loom",
            "Chronos Coil", "Stellar Forge", "Quantum Matrix", "Dark Spire", "Nebula Press",
            "Entropy Vault", "Prism Core", "Tachyon Anchor", "Aether Reactor", "Helix Array",
            "Dimension Fold", "Infinity Ring", "Zero-Point Rig", "God Particle Loom", "Omniverse Hub",
            "Genesis Foundry", "Alpha Spire", "Omega Nexus", "Cosmic Weaver", "Eternity Engine",
            "Supermassive Rig", "Quark Compressor", "Event Horizon", "Harmonic Spindle", "Subatomic Press",
            "Photon Crucible", "Flux Matrix", "Aether Well", "Time Loom", "Singularity Press",
            "Void Reactor", "Stellar Anchor", "Quantum Array", "Dark Engine", "Nebula Forge",
            "Entropy Spire", "Prism Core Mk.II", "Tachyon Rig", "Helix Generator", "Dimension Press",
            "Infinity Matrix", "Zero-Point Loom", "God Particle Forge", "Omniverse Array", "The Core Source"
        ];

        // Initialize 50 Buildings
        for (let i = 0; i < 50; i++) {
            let baseCost = Math.floor(15 * Math.pow(3.8, i / 1.12));
            let baseCps = Math.floor(1 * Math.pow(2.45, i));
            game.buildings.push({
                id: i,
                name: buildingNames[i],
                cost: baseCost,
                baseCost: baseCost,
                cps: baseCps,
                owned: 0
            });
        }

        // Initialize 5000 Upgrades
        for (let i = 0; i < 5000; i++) {
            let targetBuilding = i % 50;
            let tier = Math.floor(i / 50) + 1;
            let rawCost = Math.floor(120 * Math.pow(1.3, i / 22));
            game.upgrades.push({
                id: i,
                name: `${game.buildings[targetBuilding].name} v${tier}`,
                cost: rawCost,
                target: targetBuilding,
                bought: false,
                unlocked: i < 50
            });
        }

        // Achievements
        for (let i = 0; i < 50; i++) {
            game.achievements.push({
                id: i,
                name: `Milestone Tier ${i + 1}`,
                desc: `Reach aggregate yield threshold #${i + 1}.`,
                target: Math.floor(1000 * Math.pow(4.5, i)),
                unlocked: false
            });
        }

        function clickQuanta(event) {
            let gain = game.cpc * (1 + game.chips * 0.05);
            game.quanta += gain;
            game.totalEarned += gain;
            game.totalClicks++;

            if (event) {
                let floatEl = document.createElement('div');
                floatEl.className = 'click-float';
                floatEl.innerText = `+${formatNumber(gain)}`;
                floatEl.style.left = `${event.clientX - 15}px`;
                floatEl.style.top = `${event.clientY - 15}px`;
                document.body.appendChild(floatEl);
                setTimeout(() => floatEl.remove(), 700);
            }
            updateDisplay();
        }

        function buyBuilding(id) {
            let b = game.buildings[id];
            if (game.quanta >= b.cost) {
                game.quanta -= b.cost;
                b.owned++;
                b.cost = Math.floor(b.baseCost * Math.pow(1.15, b.owned));
                
                game.upgrades.forEach(u => {
                    if (u.target === id && b.owned >= (Math.floor(u.id / 50) * 5 + 1)) {
                        u.unlocked = true;
                    }
                });

                recalculateCPS();
                renderBuildings();
                renderUpgrades();
            }
        }

        function buyUpgrade(id) {
            let u = game.upgrades[id];
            if (!u.bought && game.quanta >= u.cost) {
                game.quanta -= u.cost;
                u.bought = true;
                recalculateCPS();
                renderUpgrades();
            }
        }

        function recalculateCPS() {
            let totalCPS = 0;
            game.buildings.forEach(b => {
                let buildingUpgrades = game.upgrades.filter(u => u.target === b.id && u.bought);
                let mult = 1;
                buildingUpgrades.forEach(() => mult *= 1.25);
                totalCPS += (b.cps * b.owned * mult);
            });
            game.cps = totalCPS * (1 + game.chips * 0.05);
        }

        function ascend() {
            let pendingChips = Math.floor(Math.sqrt(game.totalEarned / 1e15));
            if (pendingChips > 0) {
                game.chips += pendingChips;
                game.quanta = 0;
                game.totalEarned = 0;
                game.cps = 0;
                game.buildings.forEach(b => { b.owned = 0; b.cost = b.baseCost; });
                game.upgrades.forEach(u => { u.bought = false; });
                alert(`Ascended successfully! Claimed ${pendingChips} Legacy Shards.`);
                recalculateCPS();
                renderBuildings();
                renderUpgrades();
            } else {
                alert("More progress required before ascension.");
            }
        }

        let mgActive = false;
        function triggerOverclock() {
            if (!mgActive) {
                mgActive = true;
                document.getElementById('mg-status').innerText = "SURGE ACTIVE!";
                document.getElementById('mg-btn').innerText = "Cooling...";
                game.quanta += Math.max(500, game.cps * 60);
                setTimeout(() => {
                    mgActive = false;
                    document.getElementById('mg-status').innerText = "Matrix Calibrated";
                    document.getElementById('mg-btn').innerText = "Harmonic Surge";
                }, 15000);
            }
        }

        function switchTab(column, paneId) {
            let col = document.getElementById(column === 'mid' ? 'mid-col' : 'right-col');
            col.querySelectorAll('.tab-pane').forEach(p => p.classList.remove('active'));
            col.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
            document.getElementById(paneId).classList.add('active');
            event.target.classList.add('active');
            if (paneId === 'stats-pane') renderStats();
        }

        function renderBuildings() {
            let container = document.getElementById('buildings-container');
            container.innerHTML = '';
            game.buildings.forEach(b => {
                container.innerHTML += `
                    <div class="item-card">
                        <div style="display:flex; align-items:center;">
                            <canvas id="b_icon_${b.id}" class="pixel-icon" width="16" height="16"></canvas>
                            <div>
                                <strong style="color:var(--gold);">${b.name}</strong> [${b.owned}]<br>
                                <small style="color:var(--text-dim);">Cost: ${formatNumber(b.cost)} | +${formatNumber(b.cps)} CPS</small>
                            </div>
                        </div>
                        <button class="action-btn" onclick="buyBuilding(${b.id})">Buy</button>
                    </div>
                `;
            });
            // Draw pixel icons after rendering DOM
            game.buildings.forEach(b => drawPixelSprite(`b_icon_${b.id}`, b.id + 7));
        }

        function renderUpgrades() {
            let container = document.getElementById('upgrades-container');
            container.innerHTML = '';
            let count = 0;
            for (let u of game.upgrades) {
                if (u.unlocked && !u.bought) {
                    container.innerHTML += `
                        <div class="item-card">
                            <div>
                                <strong style="font-size:0.85rem;">${u.name}</strong><br>
                                <small style="color:var(--text-dim);">Cost: ${formatNumber(u.cost)}</small>
                            </div>
                            <button class="action-btn" onclick="buyUpgrade(${u.id})">Unlock</button>
                        </div>
                    `;
                    count++;
                    if (count > 35) break;
                }
            }
        }

        function renderAchievements() {
            let container = document.getElementById('achievements-container');
            container.innerHTML = '';
            game.achievements.forEach(a => {
                container.innerHTML += `
                    <div class="item-card" style="opacity: ${a.unlocked ? 1 : 0.4}">
                        <div>
                            <strong>${a.name}</strong><br>
                            <small style="color:var(--text-dim);">${a.desc}</small>
                        </div>
                        <div>${a.unlocked ? '✅' : '🔒'}</div>
                    </div>
                `;
            });
        }

        function renderStats() {
            let container = document.getElementById('stats-container');
            let days = Math.floor(game.timePlayed / 86400);
            let hours = Math.floor((game.timePlayed % 86400) / 3600);
            let minutes = Math.floor((game.timePlayed % 3600) / 60);
            let seconds = Math.floor(game.timePlayed % 60);

            let totalBuildingsOwned = game.buildings.reduce((sum, b) => sum + b.owned, 0);
            let boughtUpgradesList = game.upgrades.filter(u => u.bought).map(u => u.name).join(', ') || "None yet";
            let unlockedAchievementsList = game.achievements.filter(a => a.unlocked).map(a => a.name).join(', ') || "None yet";

            container.innerHTML = `
                <div class="stat-row"><span class="stat-label">Playtime:</span> <span class="stat-value">${days}d ${hours}h ${minutes}m ${seconds}s</span></div>
                <div class="stat-row"><span class="stat-label">Total Harvested:</span> <span class="stat-value">${formatNumber(game.totalEarned)}</span></div>
                <div class="stat-row"><span class="stat-label">Total Clicks:</span> <span class="stat-value">${game.totalClicks.toLocaleString()}</span></div>
                <div class="stat-row"><span class="stat-label">Total Buildings Owned:</span> <span class="stat-value">${totalBuildingsOwned.toLocaleString()}</span></div>
                <div class="stat-row"><span class="stat-label">Purchased Upgrades:</span> <span class="stat-value" style="font-size:0.8rem; max-width: 50%; text-align:right;">${boughtUpgradesList}</span></div>
                <div class="stat-row"><span class="stat-label">Unlocked Milestones:</span> <span class="stat-value" style="font-size:0.8rem; max-width: 50%; text-align:right;">${unlockedAchievementsList}</span></div>
            `;
        }

        // Main game loop running 20 ticks per second
        setInterval(() => {
            game.quanta += (game.cps / 20);
            game.totalEarned += (game.cps / 20);
            game.timePlayed += 0.05;

            game.achievements.forEach(a => {
                if (!a.unlocked && game.totalEarned >= a.target) {
                    a.unlocked = true;
                    renderAchievements();
                }
            });

            updateDisplay();

            // Real-time live update for stats tab every 1 second if visible
            if (Math.floor(game.timePlayed * 20) % 20 === 0) {
                let statsPane = document.getElementById('stats-pane');
                if (statsPane.classList.contains('active')) {
                    renderStats();
                }
            }
        }, 50);

        function updateDisplay() {
            document.getElementById('quanta-display').innerText = formatNumber(game.quanta);
            document.getElementById('cps-display').innerText = `CPS: ${formatNumber(game.cps)}`;
            document.getElementById('chips-display').innerText = game.chips;
            document.getElementById('chips-pending').innerText = formatNumber(Math.floor(Math.sqrt(game.totalEarned / 1e15)));
        }

        // Initial Load
        renderBuildings();
        renderUpgrades();
        renderAchievements();
    </script>
</body>
</html>
